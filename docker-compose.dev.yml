services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  dicom-anonymizer:
    build:
      context: .
    command: ["python", "app.py"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      REDIS_URL: redis://redis:6379/0
      FAVICON_URL: ${FAVICON_URL:-}
      MAX_CONTENT_LENGTH_GB: ${MAX_CONTENT_LENGTH_GB:-3}
      MAX_ARCHIVE_EXTRACTED_SIZE_GB: ${MAX_ARCHIVE_EXTRACTED_SIZE_GB:-1}
      MAX_ARCHIVE_ENTRIES: ${MAX_ARCHIVE_ENTRIES:-10000}
      LIQUIDFILES_URL: ${LIQUIDFILES_URL:-}
      LIQUIDFILES_API_KEY: ${LIQUIDFILES_API_KEY:-}
      LIQUIDFILES_TIMEOUT_SECONDS: ${LIQUIDFILES_TIMEOUT_SECONDS:-1800}
      LIQUIDFILES_EXPIRY_DAYS: ${LIQUIDFILES_EXPIRY_DAYS:-7}
    volumes:
      - .:/app
    ports:
      - "5000:5000"